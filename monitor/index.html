<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRPO 训练监控</title><style>body{background:#101418;color:#eaf0f6;font:15px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:30px}section{background:#171e25;border:1px solid #2c3844;border-radius:10px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.v{font-size:26px;color:#69dec5}canvas{width:100%;height:220px}progress{width:100%}table{width:100%;text-align:left}td,th{padding:8px;border-bottom:1px solid #2c3844}.dim{color:#a0adbc}a{color:#88b7ff}</style><main><h1>GRPO 训练监控</h1><p class="dim">采样奖励与固定评测奖励分别展示 · 每 5 秒刷新</p><section><span id="stage">等待日志</span> <strong id="steps"></strong><progress id="progress" max="40" value="0"></progress><small id="updated" class="dim"></small><p id="completed" class="dim"></p></section><div class="grid"><section>采样奖励<div id="reward" class="v">—</div></section><section>训练 KL<div id="kl" class="v">—</div></section><section>固定评测 CE<div id="ce" class="v">—</div></section><section>最佳检查点<div id="best" class="v">—</div></section></div><section><h2>奖励曲线</h2><p class="dim">蓝色：训练采样奖励　绿色：固定评测奖励</p><canvas id="rewards"></canvas></section><section><h2>训练 KL 与验证 CE</h2><p class="dim">蓝色：训练 KL　绿色：固定评测 CE（各自独立纵轴）</p><canvas id="metrics"></canvas></section><section><h2>固定评测记录</h2><table><thead><tr><th>步数</th><th>奖励</th><th>CE</th><th>有效率</th><th>选优资格</th></tr></thead><tbody id="rows"></tbody></table></section><p id="error" class="dim"></p></main><script>
const e=id=>document.getElementById(id), f=x=>Number.isFinite(x)?x.toFixed(4):'—';
function plot(id,series,target,independent=false){let c=e(id),w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.scale(d,d);x.fillStyle='#a0adbc';let all=series.flatMap(s=>s.p).filter(p=>Number.isFinite(p[1]));if(!all.length){x.fillText('等待数据',10,25);return}series.forEach(s=>{let p=s.p.filter(a=>Number.isFinite(a[1]));if(!p.length)return;let vals=(independent?p:all).map(a=>a[1]),lo=Math.min(...vals),hi=Math.max(...vals),pad=Math.max((hi-lo)*.15,.025);lo-=pad;hi+=pad;x.strokeStyle=s.c;x.fillStyle=s.c;x.lineWidth=2;x.beginPath();p.forEach((a,i)=>{let xx=35+a[0]/Math.max(target,1)*(w-50),yy=h-25-(a[1]-lo)/(hi-lo)*(h-40);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();p.forEach(a=>{x.beginPath();x.arc(35+a[0]/Math.max(target,1)*(w-50),h-25-(a[1]-lo)/(hi-lo)*(h-40),3,0,7);x.fill()});x.fillText(f(lo)+' – '+f(hi),40,15+(s.c==='#69dec5'?14:0))})}
async function refresh(){try{let r=await fetch('/grpo_v2/status.json',{cache:'no-store'});if(!r.ok)throw Error();let s=await r.json(),t=s.train.at(-1),v=s.validation.at(-1);e('stage').textContent=s.stage;e('steps').textContent=`${s.step} / ${s.target} 步`;e('progress').max=s.target;e('progress').value=s.step;e('updated').textContent=s.updated_at?'日志更新时间：'+new Date(s.updated_at*1000).toLocaleString('zh-CN'):'';e('completed').textContent=s.status==='completed'?`训练完成：最终第 ${s.step} 步；选中第 ${s.best_step} 步检查点`:'';e('reward').textContent=f(t?.reward_mean);e('kl').textContent=f(t?.kl);e('ce').textContent=f(v?.sft_ce);e('best').textContent=s.best_step==null?'—':`第 ${s.best_step} 步`;e('rows').replaceChildren();[...s.validation].reverse().forEach(v=>{let tr=e('rows').insertRow();[v.step,f(v.reward_mean),f(v.sft_ce),f(v.valid_rate),v.eligible?'通过':'未通过'].forEach(a=>tr.insertCell().textContent=a)});let pts=(a,k)=>a.map(v=>[v.step,v[k]]);plot('rewards',[{p:pts(s.train,'reward_mean'),c:'#88b7ff'},{p:pts(s.validation,'reward_mean'),c:'#69dec5'}],s.target);plot('metrics',[{p:pts(s.train,'kl'),c:'#88b7ff'},{p:pts(s.validation,'sft_ce'),c:'#69dec5'}],s.target,true);e('error').textContent=''}catch{e('error').textContent='暂时无法读取状态，保留上次数据。'}}refresh();setInterval(refresh,5000);
</script></html>
